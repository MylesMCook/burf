[package]
name = "burf"
version = "0.3.9"
description = "Burf: agents on your boxes"
authors = ["Sean Brydon"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# matters on Windows (rust-lang/cargo#8519).
name = "burf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews, which browser panes are. "devtools"
# keeps WebKit's Web Inspector in release builds, for a Browser tab's Inspect
# button and its page's Inspect Element (browser.rs). On macOS that is a
# private WebKit API (developerExtrasEnabled), which the App Store refuses;
# Burf ships notarized outside it.
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# A Browser tab's Web Inspector opens in its own window (browser.rs).
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
