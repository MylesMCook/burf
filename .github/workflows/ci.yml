name: ci

# Pull requests and main pushes run blocking verification.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs all of this on the tag first, and fails the release on
  # any failure.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels the run still going for the older one.
# A release's checks (workflow_call) run under the tag's ref, so they are
# never cancelled by a push to main.
concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on omarchy, the owner's self-hosted runner (ci/runner/), when the
# repository variable SELF_HOSTED is true and the event is the owner's push;
# everything else, pull requests included, runs on ubuntu-latest.
jobs:
  # What this change can break (scripts/ci-changes.mjs), so the other jobs
  # run only when it reaches them. A pull request is compared with its base
  # and a push to main with what main was. A release's checks and a run
  # started by hand have nothing to compare with: they run everything.
  # A pull request's run is the quick checks only, under two minutes: the
  # app's type-check, unit tests and build, go vet with the tests of the
  # packages it changed, shellcheck, the docs build. The long suites (the
  # browser suite, the Go race suite, both desktop builds, native Windows)
  # run once per merge to main, where they hold nobody up. A push to main
  # whose tree is a pull request's, already green here, runs only those.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.pick.outputs.go }}
      app: ${{ steps.pick.outputs.app }}
      e2e: ${{ steps.pick.outputs.e2e }}
      desktop: ${{ steps.pick.outputs.desktop }}
      windows: ${{ steps.pick.outputs.windows }}
      docs: ${{ steps.pick.outputs.docs }}
      shell: ${{ steps.pick.outputs.shell }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: node --test scripts/ci-changes.test.mjs
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pick() { node scripts/ci-changes.mjs "$@" | tee -a "$GITHUB_OUTPUT"; }
          case "$EVENT" in
            pull_request)
              # Checked out as the merge into its base: what it adds to that.
              git diff --name-only HEAD^1 HEAD | pick
              ;;
            push)
              # A merge that left main exactly as the pull request was: the
              # same tree passed there, under the same rule.
              if head="$(git rev-parse -q --verify HEAD^2)" && [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$head^{tree}")" ] &&
                [ "$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=1" --jq .total_count)" -gt 0 ]; then
                echo "main is $head's tree, whose quick checks passed on its pull request: the long suites are left"
                git diff --name-only HEAD^1 HEAD | pick --only=e2e,go,windows,desktop
              elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                git diff --name-only "$BEFORE" HEAD | pick
              else
                pick --all
              fi
              ;;
            *)
              pick --all
              ;;
          esac

  windows-helpers:
    needs: changes
    # After a merge only: a pull request's run is the quick checks.
    if: needs.changes.outputs.windows == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: scripts/build-tmux.sh bin amd64 arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-tmux
          path: bin/tmux-linux-*
          if-no-files-found: error

  windows:
    needs: [changes, windows-helpers]
    # After a merge only: a pull request's run is the quick checks.
    if: needs.changes.outputs.windows == 'true' && github.event_name != 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-tmux
          path: bin
      - run: go test ./internal/statefile ./internal/terminal ./internal/boxclient ./internal/proxy ./internal/network ./internal/sshconfig ./internal/hooks ./internal/service ./internal/agent ./cmd/burf
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: node --experimental-strip-types --test src/lib/platform.test.ts
        working-directory: app
      - run: node --test scripts/windows-installer-template.test.mjs scripts/windows-packaging.test.mjs
      - run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml --lib
      # No signing key enters this job. PR installers are unsigned test artifacts.
      - run: ./scripts/windows-build.ps1 -Version 0.0.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 7

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # A self-hosted runner keeps its Go caches between jobs.
          cache: ${{ runner.environment == 'github-hosted' }}
      # Sessions are tmux sessions, so their tests need it.
      # omarchy's image has it; apt's mirrors are slow from there.
      - run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
      - run: go vet ./...
      # A pull request gets the tests of the packages it changed, and no race
      # detector; the whole race suite runs after the merge.
      - name: Tests of the changed packages
        if: github.event_name == 'pull_request'
        env:
          BERTH_BROWSER_NO_SANDBOX: "1"
        run: |
          pkgs="$(git diff --name-only HEAD^1 HEAD -- '*.go' | xargs -r -n1 dirname | sort -u | while read -r d; do [ -d "$d" ] && printf './%s ' "$d"; done)"
          [ -z "$pkgs" ] || go test $pkgs
      - if: github.event_name != 'pull_request'
        run: go test -race ./...
        # GitHub's Ubuntu runners stop Chromium's sandbox (user namespaces),
        # which changes what the agent browser's status says.
        env:
          BERTH_BROWSER_NO_SANDBOX: "1"
      # A real Chromium alone, without the race detector or every other
      # package's tests starving it: it times out starting otherwise.
      - if: github.event_name != 'pull_request'
        run: go test ./internal/box/ -run 'TestAgentBrowserDrivesARealChromium|TestTheBrowserSizeReachesARealChromium' -count=1 -v
        # GitHub's Ubuntu runners stop Chromium's sandbox (user namespaces).
        env:
          BERTH_BROWSER_NO_SANDBOX: "1"
          BERTH_TEST_CHROMIUM: "1"
          # The runner's Chromium is a snap, slow to start the first time.
          BERTH_BROWSER_START_TIMEOUT: "90s"

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ubuntu-latest ships shellcheck. install.sh is served at berthd.app/install.
      - run: shellcheck scripts/check-local.sh site/install.sh scripts/build-release.sh scripts/build-tmux.sh scripts/publish.sh scripts/mac-release.sh
      # The release tests (warnings and errors; their style is their own).
      - run: shellcheck -x -S warning scripts/release-check.sh scripts/fresh-user-test.sh scripts/linux-box-test.sh scripts/upgrade-test.sh scripts/release-test/common.sh scripts/release-test/macos/lib.sh scripts/release-test/macos/launchctl scripts/release-test/linux/lib.sh scripts/release-test/linux/fake-chromium
      - run: sh -n site/install.sh && dash -n site/install.sh

  # The page's own checks and its build: quick, and first to say so.
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # A self-hosted runner keeps its pnpm store between jobs.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:plugins
      # Tooltips are the app's own, never the HTML title attribute.
      - run: pnpm check:titles
      # The release CSP must let the app load its own built-in plugins.
      - run: pnpm check:csp
      # Every built-in theme's text, states and terminal meet their contrast
      # (src/themes/contrast.ts).
      - run: pnpm check:themes
      # The split tree's moves (lib/layout.test.ts).
      - run: pnpm test
      - run: pnpm test:platform
      - run: node --test ../scripts/windows-installer-template.test.mjs ../scripts/windows-packaging.test.mjs
      - run: pnpm build
      # The browser suite's own types; its cases run in the e2e job.
      - run: pnpm exec tsc --noEmit -p e2e

  # The browser suite (e2e/): the production build in Playwright's Chromium,
  # on the mock fixtures, with no page error allowed, in three parts side by
  # side. Tags use release verification instead. A pull request's change
  # passes it on the owner's machine before the push (scripts/check-local.sh);
  # here it runs once per merge to main, and every part must pass.
  e2e:
    needs: changes
    # Not on a pull request: see the changes job.
    if: ${{ needs.changes.outputs.e2e == 'true' && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # A self-hosted runner keeps its pnpm store between jobs.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser is cached by Playwright's version; --with-deps adds the
      # system libraries.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: runner.environment == 'github-hosted' # a self-hosted runner keeps it
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # omarchy's runners share one network, so two runs at once would both
      # take Playwright's default port: each takes a free one of its own.
      - name: Pick a free port for the e2e server
        run: |
          echo "E2E_PORT=$(python3 -c '
          import random, socket
          ports = list(range(1421, 1440)); random.shuffle(ports)
          for p in ports:
              s = socket.socket()
              try:
                  s.bind(("127.0.0.1", p)); print(p); break
              except OSError:
                  pass
              finally:
                  s.close()
          ')" >> "$GITHUB_ENV"
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/3
        env:
          # omarchy has 16 cores; a hosted runner has 4.
          E2E_WORKERS: ${{ runner.environment == 'self-hosted' && '6' || '4' }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: app/node_modules/.e2e-results
          include-hidden-files: true
          retention-days: 7

  # The Linux desktop app (an alpha) builds, bundles and passes its Rust
  # tests, so a change that breaks it shows here rather than at a release.
  # A debug build with no updater signature; signed Burf Linux releases
  # remain deferred. Cached, it takes a few minutes,
  # beside the app job's longer e2e suite.
  linux-app:
    needs: changes
    # After a merge only: a pull request's run is the quick checks.
    if: needs.changes.outputs.desktop == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --locked
      # The release build's own code (cfg(not(debug_assertions))) compiles.
      - name: Check the release configuration
        working-directory: app/src-tauri
        run: cargo check --locked --release
      - name: Build the AppImage and the .deb
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --config src-tauri/tauri.linux.conf.json --debug --bundles deb,appimage
      - name: Check the bundles
        run: |
          set -euo pipefail
          deb="$(ls app/src-tauri/target/debug/bundle/deb/*.deb)"
          appimage="$(ls app/src-tauri/target/debug/bundle/appimage/*.AppImage)"
          # Extracted first: grep -q on a pipe would cut dpkg-deb off (pipefail).
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          test -x "$RUNNER_TEMP/deb/usr/bin/burf-app"
          grep -q '^MimeType=.*x-scheme-handler/berth' "$RUNNER_TEMP"/deb/usr/share/applications/*.desktop
          grep -q '^Exec=burf-app %u$' "$RUNNER_TEMP"/deb/usr/share/applications/*.desktop
          file "$appimage" | grep -q 'ELF 64-bit'
          ls -la "$deb" "$appimage"

  docs-site:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ${{ (vars.SELF_HOSTED == 'true' && github.event_name == 'push' && github.actor == github.repository_owner) && fromJSON('["self-hosted","omarchy"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: docs-site
    steps:
      # omarchy runs only the owner's pushes; its job-started hook
      # (ci/runner/job-started.sh) refuses anything else too.
      - name: Only the owner's pushes run on a self-hosted runner
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ] || [ "$EVENT" != push ]; then
            echo "::error::$EVENT by $ACTOR may not run on a self-hosted runner"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # A self-hosted runner keeps its pnpm store between jobs.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The pages are the repository's docs/ folder; a broken page fails here.
      - run: pnpm build
