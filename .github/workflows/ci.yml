name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # Sessions are tmux sessions, so their tests need it.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: go vet ./...
      - run: go test -race ./...
      # A real Chromium alone, without the race detector or every other
      # package's tests starving it: it times out starting otherwise.
      - run: go test ./internal/box/ -run 'TestAgentBrowserDrivesARealChromium' -count=1 -v
        # GitHub's Ubuntu runners stop Chromium's sandbox (user namespaces).
        env:
          BERTH_BROWSER_NO_SANDBOX: "1"
          BERTH_TEST_CHROMIUM: "1"
          # The runner's Chromium is a snap, slow to start the first time.
          BERTH_BROWSER_START_TIMEOUT: "90s"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ubuntu-latest ships shellcheck. install.sh is served at berthd.app/install.
      - run: shellcheck site/install.sh scripts/build-release.sh scripts/publish.sh scripts/mac-release.sh
      # The release tests (warnings and errors; their style is their own).
      - run: shellcheck -x -S warning scripts/release-check.sh scripts/fresh-user-test.sh scripts/linux-box-test.sh scripts/upgrade-test.sh scripts/release-test/common.sh scripts/release-test/macos/lib.sh scripts/release-test/macos/launchctl scripts/release-test/linux/lib.sh scripts/release-test/linux/fake-chromium
      - run: sh -n site/install.sh && dash -n site/install.sh

  # The Linux release tests (scripts/linux-box-test.sh, scripts/upgrade-test.sh):
  # install.sh on a fresh Ubuntu 24.04 box in Docker (systemd as init),
  # pairing a fresh laptop, a task with the stand-in agent, the proxy, the
  # agent browser's sandbox card, and upgrading from the last release. The
  # macOS half needs the app and a Mac: make release-check runs it before a
  # release is tagged.
  release-test-linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Fresh box
        run: scripts/linux-box-test.sh --out "$RUNNER_TEMP/release-test/linux-box"
      - name: Upgrade from the last release
        env:
          # gh downloads the last release's archives.
          GH_TOKEN: ${{ github.token }}
        run: scripts/upgrade-test.sh --linux --out "$RUNNER_TEMP/release-test/upgrade-linux"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-test-linux
          path: ${{ runner.temp }}/release-test
          if-no-files-found: ignore

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:plugins
      # Tooltips are the app's own, never the HTML title attribute.
      - run: pnpm check:titles
      # The release CSP must let the app load its own built-in plugins.
      - run: pnpm check:csp
      # Every built-in theme's text, states and terminal meet their contrast
      # (src/themes/contrast.ts).
      - run: pnpm check:themes
      # The split tree's moves (lib/layout.test.ts).
      - run: pnpm test
      - run: pnpm build
      # The smoke suite (e2e/): the production build in Playwright's Chromium,
      # on the mock fixtures, with no page error allowed. The browser is
      # cached by Playwright's version; --with-deps adds the system libraries.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: app/node_modules/.e2e-results
          include-hidden-files: true
          retention-days: 7

  docs-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The pages are the repository's docs/ folder; a broken page fails here.
      - run: pnpm build
