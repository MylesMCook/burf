name: tmux-cache

# Builds Berth's static tmux on main and keeps it in the Actions cache, where
# a release's tmux job (release.yml, on a tag) finds it: a tag's run reads
# main's caches, not other tags'. It runs when build-tmux.sh changes (a new
# tmux or a new pin), or by hand.
on:
  push:
    branches: [main]
    paths: [scripts/build-tmux.sh]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tmux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            bin/tmux-linux-amd64
            bin/tmux-linux-arm64
          key: tmux-${{ hashFiles('scripts/build-tmux.sh') }}
      - run: scripts/build-tmux.sh bin amd64 arm64
      - name: Check they run
        run: |
          file bin/tmux-linux-amd64 bin/tmux-linux-arm64
          bin/tmux-linux-amd64 -V
