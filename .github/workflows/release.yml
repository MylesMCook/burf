name: release

# A v* tag builds berthd and berth for every platform install.sh and the CLI
# support, and attaches the archives and checksums.txt to the tag's GitHub
# release (creating it when scripts/publish.sh has not already). The archive
# names carry no version, so releases/latest/download/<name> always works.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - run: go vet ./...
      - run: go test -race ./...
      - run: shellcheck site/install.sh scripts/build-release.sh scripts/publish.sh
      - name: Build archives
        run: make release VERSION="$GITHUB_REF_NAME"
      - name: Check the stamped version
        run: |
          tar -xzf dist/berthd-linux-amd64.tar.gz -C "$RUNNER_TEMP" berthd
          "$RUNNER_TEMP/berthd" version | tee /dev/stderr | grep -q "^berthd $GITHUB_REF_NAME "
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --title "Berth $TAG" --generate-notes
          fi
